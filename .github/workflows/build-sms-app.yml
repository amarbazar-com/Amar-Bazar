name: Build SMS app
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Build
        working-directory: android-sms
        run: gradle assembleDebug --no-daemon -Pandroid.useAndroidX=true
      - name: সই দেখা
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          echo "এই লাইনটা প্রতিবার হুবহু এক হলে ফোনে আপডেট হবে; বদলে গেলে মুছে ইনস্টল করতে হবে:"
          $AS verify --print-certs android-sms/app/build/outputs/apk/debug/app-debug.apk | grep "SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: amar-bazar-sms-apk
          path: android-sms/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
